
services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: crystal-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crystal.com
      PGADMIN_DEFAULT_PASSWORD: Pizzapizza123
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
