services:
  db:
    image: postgres:18-alpine
    container_name: crystal-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    image: majeurbilly/crystal-backend:latest
    container_name: crystal-backend-prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: CrystalAPI
      Jwt__Audience: CrystalAPIUsers
    depends_on:
      - db

  frontend:
    image: majeurbilly/crystal-frontend:latest
    container_name: crystal-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
