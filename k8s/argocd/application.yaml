# Application ArgoCD — à appliquer une seule fois pour enregistrer le dépôt GitOps.
# Les secrets (k8s/secrets.yaml) restent hors Git et doivent être créés manuellement
# ou via Sealed Secrets / External Secrets Operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crystal-erp
  namespace: argocd
  labels:
    app.kubernetes.io/name: crystal-erp
    app.kubernetes.io/part-of: crystal-erp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/majeurbilly/ERP-Crystal.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: crystal-erp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
