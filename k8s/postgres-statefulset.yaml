apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crystal-postgres
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-postgres
    app.kubernetes.io/part-of: crystal-erp
spec:
  serviceName: crystal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crystal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crystal-postgres
        app.kubernetes.io/part-of: crystal-erp
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: crystal-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: crystal-postgres
          app.kubernetes.io/part-of: crystal-erp
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
