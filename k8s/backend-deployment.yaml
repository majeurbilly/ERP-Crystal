apiVersion: apps/v1
kind: Deployment
metadata:
  name: crystal-backend
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-backend
    app.kubernetes.io/part-of: crystal-erp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crystal-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crystal-backend
        app.kubernetes.io/part-of: crystal-erp
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              POSTGRES_HOST="crystal-postgres.crystal-erp.svc.cluster.local"
              until nc -z "${POSTGRES_HOST}" 5432; do
                echo "En attente de PostgreSQL (${POSTGRES_HOST})..."
                sleep 2
              done
      containers:
        - name: backend
          image: crystal-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
          envFrom:
            - secretRef:
                name: crystal-backend-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/wwwroot/images/items
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: crystal-backend-uploads
