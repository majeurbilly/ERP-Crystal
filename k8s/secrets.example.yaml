# Copier ce fichier vers secrets.yaml et remplacer les valeurs CHANGE_ME
# avant le déploiement. Ne jamais committer secrets.yaml.
#
#   cp secrets.example.yaml secrets.yaml
#
# Correspondance Crystal.API (ASP.NET Core) :
# ┌────────────────────────────────────────────┬──────────────────────────────────┐
# │ Clé Secret (env)                           │ Section appsettings.json         │
# ├────────────────────────────────────────────┼──────────────────────────────────┤
# │ ConnectionStrings__DefaultConnection       │ ConnectionStrings:DefaultConnection │
# │ Jwt__Key                                   │ Jwt:Key                          │
# │ Jwt__Issuer                                │ Jwt:Issuer                       │
# │ Jwt__Audience                              │ Jwt:Audience                     │
# └────────────────────────────────────────────┴──────────────────────────────────┘
#
# Alternative (si ConnectionStrings__DefaultConnection absent) :
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   → résolues par DatabaseConnectionResolver.cs
#
# PostgreSQL (image officielle) :
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   → doivent correspondre à Username/Password de la chaîne de connexion
#
apiVersion: v1
kind: Secret
metadata:
  name: crystal-postgres-secret
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-postgres
    app.kubernetes.io/part-of: crystal-erp
type: Opaque
stringData:
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "bd-erp-crystal"
---
apiVersion: v1
kind: Secret
metadata:
  name: crystal-backend-secret
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-backend
    app.kubernetes.io/part-of: crystal-erp
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=crystal-postgres;Port=5432;Database=bd-erp-crystal;Username=CHANGE_ME;Password=CHANGE_ME"
  Jwt__Key: "CHANGE_ME_GENERATE_A_LONG_RANDOM_KEY"
  Jwt__Issuer: "CrystalAPI"
  Jwt__Audience: "CrystalAPIUsers"
