apiVersion: batch/v1
kind: Job
metadata:
  name: crystal-migration
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-migration
    app.kubernetes.io/part-of: crystal-erp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crystal-migration
        app.kubernetes.io/part-of: crystal-erp
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z crystal-postgres 5432; do
                echo "En attente de PostgreSQL..."
                sleep 2
              done
      containers:
        - name: migration
          image: crystal-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "Crystal.API.dll", "--migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          envFrom:
            - secretRef:
                name: crystal-backend-secret
