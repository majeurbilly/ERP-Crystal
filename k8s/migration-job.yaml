apiVersion: batch/v1
kind: Job
metadata:
  name: crystal-migration
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-migration
    app.kubernetes.io/part-of: crystal-erp
  annotations:
    # Sync (pas PreSync) : exécuté après la vague 0 (PostgreSQL prêt)
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crystal-migration
        app.kubernetes.io/part-of: crystal-erp
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              POSTGRES_HOST="crystal-postgres.crystal-erp.svc.cluster.local"
              echo "Attente de PostgreSQL sur ${POSTGRES_HOST}:5432..."
              until nc -z "${POSTGRES_HOST}" 5432; do
                echo "PostgreSQL indisponible, nouvelle tentative dans 2s..."
                sleep 2
              done
              echo "PostgreSQL est prêt."
      containers:
        - name: migration
          image: crystal-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "Crystal.API.dll", "--migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          envFrom:
            - secretRef:
                name: crystal-backend-secret
