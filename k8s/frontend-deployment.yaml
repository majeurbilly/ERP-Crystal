apiVersion: apps/v1
kind: Deployment
metadata:
  name: crystal-frontend
  namespace: crystal-erp
  labels:
    app.kubernetes.io/name: crystal-frontend
    app.kubernetes.io/part-of: crystal-erp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crystal-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crystal-frontend
        app.kubernetes.io/part-of: crystal-erp
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z crystal-backend 8080; do
                echo "En attente du backend..."
                sleep 2
              done
      containers:
        - name: frontend
          image: crystal-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: crystal-frontend-nginx
