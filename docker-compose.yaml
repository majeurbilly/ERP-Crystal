
services:
  db:
    image: postgres:18-alpine
    container_name: crystal-db
    restart: always
    environment:
      POSTGRES_USER: stringempty
      POSTGRES_PASSWORD: Pizzapizza123
      POSTGRES_DB: bd-erp-crystal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crystal-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=bd-erp-crystal;Username=stringempty;Password=Pizzapizza123
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crystal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
